# Allowed tracker statuses, in order. Use these words exactly.
statuses:
  - Spotted        # found, not evaluated
  - Evaluated      # report written
  - Not eligible   # failed a hard gate
  - Skipped        # below threshold or coach/client decided no
  - Drafting       # documents in progress
  - Ready          # documents approved, waiting for client to submit
  - Applied        # client confirmed submission (date required)
  - Test           # written test or assessment invited
  - Interview      # interview invited (date required)
  - Rostered       # placed on a roster (UN); keep watching
  - Offer
  - Accepted
  - Rejected
  - Withdrawn
  - Closed         # deadline passed or post cancelled before applying
