# Scoring rules for modes/evaluate.md
# Weights from research/05 §10, approved by the coach on 17 Nov 2026. Test them on real cases and adjust.

hard_gates:
  # A failed gate = "Not eligible". The agent must quote the sentence in the ad that sets the rule.
  - id: nationality
    check: "National Officer (NO/NOA-NOD) posts need nationality of the duty-station country. EPSO permanent posts need EU nationality. YPP/JPO list eligible countries each year."
  - id: right_to_work
    check: "General Service (G) posts, embassy local posts and most local NGO posts need existing legal right to work. No sponsorship."
  - id: minimum_education_and_years
    check: "UN screening is eliminatory on stated minimums. P-2 about 2 years, P-3 5, P-4 7, P-5 10 with a master's (add about 2 with a bachelor's at some agencies). NO-A/NO-1 1, NO-B/NO-2 2, NO-C/NO-3 5, NO-D/NO-4 8."
  - id: required_languages
    check: "'Required' language = gate. 'Desirable' = score only."
  - id: age_limit
    check: "YPP: 32 or younger in the exam year. Some JPO schemes have their own limits."
  - id: documents
    check: "P11, Europass, declaration on honour, references, police certificate if requested."
  - id: client_dealbreakers
    check: "Anything in the client's profile.yml -> dealbreakers (for example non-family duty station, unpaid, a specific country)."

weights:
  # Must add up to 100.
  cv_match_essential_criteria: 30   # each essential criterion met with a real example
  funding_security: 15              # core or multi-donor funded vs "subject to funding", single donor, deep-cut sub-sector
  contract_type_and_length: 10      # staff/FTA 2+ years vs under 6 months; consultancy scored to client preference
  career_trajectory: 10             # one grade up (B), entry route (A), bridge (C, D); two grades up scores low
  mission_and_values_fit: 10        # client's themes and approaches vs organisation's
  duty_station_and_security: 10     # mobility, family status, risk tolerance
  pay_vs_needs: 5                   # net pay at duty station vs client's floor
  process_cost: 5                   # tests, assessment centres, long timelines vs urgency
  competition_signal: 5             # national post, niche language, rare skill vs generic global post

segment_adjustments:
  A:  # New grads
    skip_threshold: 3.5
    notes: "Boost entry routes: UNV, NO-A, paid internships, YPP, JPO, fellowships, local NGOs. Count volunteering and studies."
  B:  # Moving up
    skip_threshold: 4.0
    notes: "Flag any post more than one grade above current level."
  C:  # Shifters
    skip_threshold: 4.0
    notes: "Add a translation check: do corporate results map to the ad's sector terms? Prefer CSR, foundations, banks, fundraising, partnerships, ICT, finance, compliance."
  D:  # Repositioning
    skip_threshold: 4.0
    # No weight overrides: funding security stays at 15 (coach decision, 17 Nov 2026).
    notes: "Accept consultancies as bridges. Flag deep-cut sub-sectors and suggest adjacent ones."

funding_signals:
  lower:
    - "subject to funding / contingent on award / key personnel / letter of commitment (proposal recruitment)"
    - "single donor, especially US government legacy funding"
    - "sub-sectors with deepest cuts in 2025-2026: global health, some humanitarian clusters, governance (see sector/primer.md §5)"
    - "contract under 6 months with no renewal language"
  higher:
    - "core-funded or multi-donor organisation"
    - "growing funders: development banks, EU, Gulf donors, some foundations"
    - "growing functions: fundraising and partnerships, ICT and data, compliance, cash assistance, climate and anticipatory action"

verdict_bands:
  apply_priority: 4.5
  apply: 4.0
  consider: 3.5
  research_first: 3.0
  # below 3.0 = skip
