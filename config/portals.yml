# Job and consultancy sources for modes/scan.md and modes/content/roundup.md.
# "check: yes" = seen only in curated lists during research; open it once and confirm before relying on it.
# Always link the employer's OFFICIAL apply page in reports and roundups. Aggregators are for discovery only.

global:
  - name: ReliefWeb Jobs
    url: https://reliefweb.int/jobs
    best_for: Humanitarian and development jobs and consultancies worldwide; filters by country, theme, type
  - name: UN Careers (Secretariat, Inspira)
    url: https://careers.un.org
    best_for: UN Secretariat posts, YPP, internships
  - name: UNjobs
    url: https://unjobs.org
    best_for: Aggregator of UN and INGO posts by duty station
  - name: UNjobnet
    url: https://www.unjobnet.org
    best_for: UN system aggregator plus strong guides (P11, timelines, contract types)
  - name: Impactpool
    url: https://www.impactpool.org
    best_for: UN, IFIs, INGOs; career advice
  - name: Devex Jobs
    url: https://www.devex.com/jobs
    best_for: Development jobs, contractors, consultancies (some paid features)
  - name: DevNetJobs
    url: https://www.devnetjobs.org
    best_for: Development consultancies and jobs
  - name: DevelopmentAid
    url: https://www.developmentaid.org
    best_for: Development jobs and tenders; paid tiers
  - name: Idealist
    url: https://www.idealist.org
    best_for: Nonprofit jobs, mostly US
  - name: UNV (UN Volunteers)
    url: https://app.unv.org
    best_for: Entry routes for segment A; national and international volunteer assignments
  - name: UNDP Jobs
    url: https://jobs.undp.org
  - name: UNICEF Careers
    url: https://jobs.unicef.org
  - name: UNHCR Careers
    url: https://www.unhcr.org/careers
  - name: WFP Careers
    url: https://www.wfp.org/careers
  - name: IOM Careers
    url: https://www.iom.int/careers
  - name: ICRC Careers
    url: https://careers.icrc.org
  - name: IFRC Jobs
    url: https://www.ifrc.org/jobs
  - name: World Bank Careers
    url: https://www.worldbank.org/en/about/careers
  - name: unvacancies.org
    url: https://unvacancies.org
    best_for: Independent UN aggregator with hiring index and scam checker (not affiliated with the UN)
    check: yes
  - name: Climatebase
    url: https://climatebase.org
    best_for: Climate jobs incl. NGOs and social enterprises

europe:
  - name: Bond Jobs (UK)
    url: https://www.bond.org.uk/jobs
  - name: CharityJob (UK)
    url: https://www.charityjob.co.uk
    best_for: UK charities; supporting-statement culture
  - name: EU Careers (EPSO)
    url: https://eu-careers.europa.eu
  - name: EEAS vacancies
    url: https://www.eeas.europa.eu/eeas/vacancies_en
  - name: GIZ Jobs
    url: https://jobs.giz.de
  - name: Coordination SUD (France, French-speaking NGOs)
    url: https://www.coordinationsud.org/offres-emploi/
    check: yes

mena:
  - name: Daleel Madani (Lebanon)
    url: https://www.daleel-madani.org
  - name: Bayt
    url: https://www.bayt.com
    best_for: Gulf and MENA, incl. CSR and corporate foundations
  - name: Zaytoonz (Jordan job roundups on LinkedIn)
    url: https://www.linkedin.com/company/zaytoonz
    check: yes

africa:
  - name: NGO Jobs in Africa
    url: https://ngojobsinafrica.com
    check: yes

asia:
  - name: NGO Box
    url: https://ngobox.org
    check: yes

latin_america:
  - name: Haces Falta (Spanish-language)
    url: https://www.hacesfalta.org
    check: yes

us_canada_australia:
  - name: Work for Good
    url: https://www.workforgood.org
    check: yes
  - name: Pro Bono Australia
    url: https://probonoaustralia.com.au/jobs/
    check: yes

consultancy_calls:
  # Consultancy calls are in scope for scans and roundups (coach decision, 16 Nov 2026). Grants are not.
  - ReliefWeb Jobs (filter: Consultancy)
  - UNDP Procurement notices: https://procurement-notices.undp.org
  - UN Global Marketplace: https://www.ungm.org
  - DevNetJobs consultancies
  - Devex (consultant opportunities)

search_keywords:
  # Add per client in profile.yml -> targets.keywords. These are shared negatives.
  negative: ["grant", "call for proposals for organisations", "sub-grant", "fee required", "processing fee"]
